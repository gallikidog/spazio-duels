# ======================================================
#             SpazioDuels Configuration File
# ======================================================

settings:
  # Duracion maxima del duelo en segundos (10 minutos por defecto)
  max_duel_duration_seconds: 600
  
  # Segundos de cuenta regresiva antes de iniciar la batalla
  countdown_seconds: 5
  
  # Permitir vuelo durante duelos
  allow_flight: false

protection:
  # Comandos permitidos durante el duelo
  command_whitelist:
    - "/duel forfeit"
    - "/duel cancel"
    - "/g"
    - "/msg"
    - "/r"

  # Bloquear la tirada de items en duelos
  prevent_item_drop: true

  # Bloquear guardar items en cofres/enderchests durante duelos
  prevent_container_store: true

  # Permitir construccion solo si el kit lo define (ej. UHC)
  rollback_placed_blocks: true

event:
  # Tiempo de espera en segundos para que los jugadores se unan al evento antes de iniciar
  lobby_countdown: 45

  # Formato del mensaje de inicio de evento
  start_broadcast:
    - "&e-------------------------------------------"
    - "              &6&lEVENTO DE DUELOS"
    - ""
    - "	 &fUn evento de duelos iniciara en breves."
    - ""
    - "	 &7Modo seleccionado: &b%spazioduels_mode%"
    - "	 &7Kit seleccionado: &b%spazioduels_kitselect%"
    - ""
    - "	 &7Recompensa:"
    - "	 &f- %spazioduels_randomreward%"
    - "	 &f- %spazioduels_randomreward%"
    - "	 &f- %spazioduels_randomreward%"
    - ""
    - "	 &a&l[ - CLICK PARA INGRESAR AL EVENTO - ]"
    - "&e-------------------------------------------"

  # Formato del mensaje de finalizacion del evento
  end_broadcast:
    - "&e-------------------------------------------"
    - "              &6&lEVENTO DE DUELOS"
    - ""
    - "	 &fEl duelo &b%spazioduels_event% &fha finalizado."
    - ""
    - "	 &7Los ganadores del evento son:"
    - "	 &a%spazioduels_winer%&f/&a%spazioduels_winer_team%"
    - ""
    - "	 &7Recompensas recibidas:"
    - ""
    - "	 &f- %spazioduels_randomreward%"
    - "	 &f- %spazioduels_randomreward%"
    - "	 &f- %spazioduels_randomreward%"
    - ""
    - "	 &e&l[ - CLICK PARA VER LA INFORMACION - ]"
    - "&e-------------------------------------------"

# Hosteo automatico de eventos/torneos de duelos durante el dia
duel_event_autostart:
  enabled: true
  interval_minutes: 90
  modes_pool:
    - "1v1"
    - "2v2"
    - "3v3"
    - "4v4"
    - "2v1"
  kits_pool: []

# Configuración del Sistema KOTH (King Of The Hill)
koth:
  # Titulo de entrada a la zona del KOTH
  zone_entry_title: "&6&lKOTH"
  zone_entry_subtitle: "&fIngresaste a la zona del Koth &b%koth%"

  # Titulo en pantalla para el ganador al capturar
  winner_title: "&a&l¡FELICITACIONES!"
  winner_subtitle: "&fCapturaste el Koth &b%koth%"

  # Mensaje global en el chat al capturar el KOTH
  broadcast_win:
    - "&e-------------------------------------------"
    - "              &6&lKOTH CAPTURADO"
    - ""
    - "	 &fEl jugador &b%player% &fha capturado el KOTH &e%koth%&f!"
    - "	 &7¡Ha recibido el botín de victoria!"
    - ""
    - "&e-------------------------------------------"

# Hosteo automatico de KOTHs durante el dia
koth_autostart:
  enabled: true
  interval_minutes: 120
  koths_pool: []

rewards:
  default_pool:
    - name: "&a10,000 Monedas"
      command: "eco give %player% 10000"
    - name: "&bLlave de Crate Mítica"
      command: "crate give %player% mythic 1"
    - name: "&cEspada de Duelos Especial"
      command: "give %player% diamond_sword 1"
    - name: "&e500 Puntos de Duelos"
      command: "eco give %player% 500"
    - name: "&61x Manzana de Oro Encantada"
      command: "give %player% enchanted_golden_apple 1"
